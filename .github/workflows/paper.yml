# Paper trading with real option quotes. Runs once per trading day during market hours and commits paper/ back to the repo.
name: Paper trade
on:
  schedule:
    # every 30 min, 14:07-21:37 UTC (covers 10:00-15:55 ET in EST and EDT). GitHub often starts these hours late;
    # the script acts on the first run inside market hours each day and skips the rest.
    - cron: "7,37 14-21 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Dry run now, any time (saves nothing; quotes may be stale)"
        required: false
        default: "no"
        type: choice
        options: ["no", "yes"]
permissions:
  contents: write
concurrency:
  group: paper
  cancel-in-progress: false
jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python paper.py
        env:
          FORCE: ${{ inputs.force == 'yes' && '1' || '' }}
      - name: Commit results
        run: |
          git config user.name "paper-trade bot"
          git config user.email "actions@users.noreply.github.com"
          git add paper/ || true
          git diff --cached --quiet || (git commit -m "Paper trade update $(date -u +%F)" && git push)
